<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Propto">
  <title>Propto</title>
  <!-- Telhado: o traço que define o imóvel. -->
  <path d="M9 31.5 32 11l23 20.5" fill="none" stroke="currentColor" stroke-width="6.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Voz: três barras sob o telhado. É a fala que constrói o anúncio. -->
  <rect x="18.5" y="40" width="6.5" height="13" rx="3.25" fill="currentColor"/>
  <rect x="28.75" y="33.5" width="6.5" height="19.5" rx="3.25" fill="currentColor"/>
  <rect x="39" y="37" width="6.5" height="16" rx="3.25" fill="currentColor"/>
</svg>
