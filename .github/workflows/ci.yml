name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  secrets:
    name: Verificação de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4   # a versão vem do packageManager em package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  db:
    name: Banco — isolamento, fila e coerência de schema (bloqueia merge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # a versão vem do packageManager em package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Versão fixa, e não `latest`, por dois motivos. Determinismo: com
      # `latest`, um lançamento do CLI muda o comportamento do CI sem que
      # ninguém tenha feito commit. E disponibilidade: resolver `latest`
      # custa uma chamada à API do GitHub, que já reprovou este job com
      # "rate limit exceeded" — build vermelho por motivo que não é o
      # código ensina o time a ignorar vermelho.
      #
      # 2.116.0 é a mesma versão que o pnpm-lock.yaml fixa na
      # devDependency `supabase`, usada por `pnpm db:migrate`. As duas
      # precisam andar juntas: foi a divergência entre elas que quebrou
      # este job quando o CI voltou a rodar.
      - uses: supabase/setup-cli@v1
        with: { version: 2.116.0 }
      - run: supabase start
      - run: pnpm db:migrate
      - name: Testes de isolamento entre organizações
        run: pnpm test:rls
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Toda tabela de negócio tem org_id e RLS
        run: node scripts/check-rls-coverage.mjs
      - name: Máquina de estados coerente entre banco e TypeScript
        run: node scripts/check-transition-parity.mjs
      - name: Fila sob concorrência (SKIP LOCKED)
        run: pnpm test:queue
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          QUEUE_TEST_WORKERS: 8

  # A suíte dourada de IA (tests/ai) nasce no Sprint 3, junto com o agente de
  # extração — ver docs/ROADMAP.md. Enquanto o diretório não existe, um job
  # que roda `pnpm test:ai` falha em todo push e treina o time a ignorar
  # vermelho no CI, que é pior que não ter o job. Ele volta com a suíte.

  gateway:
    name: AI Gateway (roteamento, fallback, orçamento)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # a versão vem do packageManager em package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @propto/ai-gateway typecheck
      - run: pnpm --filter @propto/ai-gateway test

  media:
    name: media-worker (anonimização e pipeline de imagem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # a versão vem do packageManager em package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Versão fixa, e não `latest`, por dois motivos. Determinismo: com
      # `latest`, um lançamento do CLI muda o comportamento do CI sem que
      # ninguém tenha feito commit. E disponibilidade: resolver `latest`
      # custa uma chamada à API do GitHub, que já reprovou este job com
      # "rate limit exceeded" — build vermelho por motivo que não é o
      # código ensina o time a ignorar vermelho.
      #
      # 2.116.0 é a mesma versão que o pnpm-lock.yaml fixa na
      # devDependency `supabase`, usada por `pnpm db:migrate`. As duas
      # precisam andar juntas: foi a divergência entre elas que quebrou
      # este job quando o CI voltou a rodar.
      - uses: supabase/setup-cli@v1
        with: { version: 2.116.0 }
      - run: supabase start
      - run: pnpm db:migrate
      - run: pnpm --filter @propto/media-worker typecheck
      - run: pnpm --filter @propto/media-worker test
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

  audit:
    name: Vulnerabilidades
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # a versão vem do packageManager em package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm audit` sai com 1 tanto para vulnerabilidade encontrada quanto
      # para falha de rede ao falar com o registry — e a segunda acontece.
      # Job que fica vermelho por instabilidade ensina o time a ignorar
      # vermelho, que e pior que nao ter o job. Aqui se separa uma coisa da
      # outra: achado reprova sempre; queda de rede vira aviso depois de tres
      # tentativas.
      - name: Vulnerabilidades de severidade alta ou acima
        run: |
          for tentativa in 1 2 3; do
            if saida=$(pnpm audit --audit-level=high 2>&1); then
              echo "$saida"
              exit 0
            fi
            echo "$saida"
            if echo "$saida" | grep -qi "vulnerabilit"; then
              echo "::error::Vulnerabilidade de severidade alta ou acima encontrada."
              exit 1
            fi
            echo "::warning::Tentativa $tentativa nao alcancou o registry. Repetindo em 10s."
            sleep 10
          done
          echo "::warning::pnpm audit nao alcancou o registry em 3 tentativas. Nao ha achado, mas tambem nao houve verificacao."
